[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-telemetry-analyzer"
version = "1.0.0"
description = "Command-line Formula 1 telemetry analysis with FastF1."
requires-python = ">=3.10"
dependencies = [
    "fastf1",
    "matplotlib",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["f1_telemetry_analyzer*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
